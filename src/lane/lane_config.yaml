# Lightweight lane baseline configuration. ROI coordinates are normalized to
# the current camera image; they are a provisional road crop, not calibration.
process_every_n_frames: 3
roi_top_y: 0.48
roi_bottom_y: 0.70
roi_top_left: 0.34
roi_top_right: 0.66
roi_bottom_left: 0.02
roi_bottom_right: 0.98
bev_width: 640
bev_height: 480
max_lane_dx_per_dy: 0.75
min_lane_segment_px: 40.0
min_lane_span_ratio: 0.10
min_lane_bottom_y_ratio: 0.65
max_marking_width_px: 22.0
max_match_x_delta: 65.0
max_match_curve_rmse: 55.0
max_missing_frames: 3
new_lane_min_confidence: 0.32
solid_support_ratio: 0.58
yellow_hue_low: 12
yellow_hue_high: 42
white_saturation_max: 75
ego_lane_min_width: 70.0
ego_lane_max_width: 260.0
ego_lane_center_tolerance: 96.0
ego_lane_max_width_variation_ratio: 0.35
min_ego_lane_observations: 3
min_ego_lane_confidence: 0.55
prediction_confidence_decay: 0.70
max_prediction_frames: 2
max_prediction_updates: 2
